---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meerkat-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - meerkat-mob.dev
  resources:
  - knowledgebases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - meerkat-mob.dev
  resources:
  - knowledgebases/status
  verbs:
  - get
  - patch
  - update

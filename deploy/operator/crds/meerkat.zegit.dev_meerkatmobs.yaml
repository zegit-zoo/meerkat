---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: meerkatmobs.meerkat.zegit.dev
spec:
  group: meerkat.zegit.dev
  names:
    kind: MeerkatMob
    listKind: MeerkatMobList
    plural: meerkatmobs
    shortNames:
    - mob
    singular: meerkatmob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.root
      name: Root
      type: string
    - jsonPath: .spec.placement
      name: Placement
      type: string
    - jsonPath: .status.instances
      name: Instances
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MeerkatMob serves a KnowledgeBase tree as one or more meerkat
          instances.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MeerkatMobSpec is a tree to serve and how to serve it.
            properties:
              auth:
                description: |-
                  Auth is the hosted server's authentication, shared by every
                  instance.
                properties:
                  audience:
                    minLength: 1
                    type: string
                  configMapRef:
                    description: |-
                      ConfigMapRef names a ConfigMap holding the server's auth: policy
                      block (authz rules), in the mob's namespace.
                    type: string
                  issuer:
                    pattern: ^https://
                    type: string
                required:
                - audience
                - issuer
                type: object
              image:
                description: |-
                  Image overrides the meerkat server image. Empty means the image
                  the operator was released with.
                type: string
              librarian:
                description: |-
                  Librarian runs the librarian role on a schedule against a
                  temporary full-tree instance.
                properties:
                  schedule:
                    description: Schedule is a five-field cron expression, as a CronJob's.
                    minLength: 9
                    type: string
                required:
                - schedule
                type: object
              placement:
                description: Placement is perTier, perKB or single (the default).
                enum:
                - perTier
                - perKB
                - single
                type: string
              root:
                description: Root names the tree's root KnowledgeBase, in the same
                  namespace.
                maxLength: 253
                minLength: 1
                type: string
              scaleToZero:
                description: |-
                  ScaleToZero scales an instance whose KnowledgeBases go unvisited
                  down to no replicas.
                properties:
                  enabled:
                    type: boolean
                  idle:
                    description: |-
                      Idle is how long an instance may go without a traversal before
                      it is scaled to zero. Defaults to 30m; at least 1m.
                    type: string
                required:
                - enabled
                type: object
              telemetry:
                description: Telemetry is the OTLP export every instance shares.
                properties:
                  endpoint:
                    pattern: ^https?://
                    type: string
                  insecure:
                    type: boolean
                required:
                - endpoint
                type: object
                x-kubernetes-validations:
                - message: 'a plaintext http:// endpoint needs insecure: true'
                  rule: '!self.endpoint.startsWith(''http://'') || (has(self.insecure)
                    && self.insecure)'
            required:
            - root
            type: object
          status:
            description: MeerkatMobStatus is what the operator last observed.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              instances:
                description: Instances is the number of Deployments the mob renders
                  to.
                format: int32
                type: integer
              knowledgeBases:
                description: KnowledgeBases is the number of KnowledgeBases in the
                  tree.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

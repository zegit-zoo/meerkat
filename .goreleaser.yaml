version: 2

project_name: meerkat

before:
  hooks:
    # Populate the embed dirs from content-source.yaml before compiling.
    - go run ./internal/contentsync
    # Regenerate THIRD-PARTY-LICENSES.txt from the modules actually
    # linked into ./cmd/meerkat (CGO_ENABLED=0, so cgo-only deps like
    # blevesearch/go-faiss are correctly excluded). Deterministic and
    # offline: it only reads the module cache `go mod download`
    # already populated. See gen-third-party-licenses.go.
    - go run gen-third-party-licenses.go

builds:
  - id: meerkat
    main: ./cmd/meerkat
    binary: meerkat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zegit-zoo/meerkat/internal/cli.version={{.Version}}
      - -X github.com/zegit-zoo/meerkat/internal/cli.commit={{.ShortCommit}}
      - -X github.com/zegit-zoo/meerkat/internal/cli.date={{.Date}}
      - -X github.com/zegit-zoo/meerkat/internal/cli.kbCommit={{.Env.KB_COMMIT}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Goreleaser appends .exe automatically when goos is windows,
    # so the `binary: meerkat` setting above yields meerkat.exe
    # inside the Windows zip.

  # meerkat-bootstrap (see cmd/meerkat-bootstrap and
  # docs/design/upstream-migration.md#converging-from-a-downstream-fork)
  # installs a zegit-zoo/meerkat release independently of whatever
  # updater the binary at its --destination understands. It reuses
  # internal/update's verification/install code unchanged, so it
  # ships from the same release, same commit, same cosign identity as
  # `meerkat` itself — deliberately not a separate repo or a
  # differently-signed artifact.
  - id: meerkat-bootstrap
    main: ./cmd/meerkat-bootstrap
    binary: meerkat-bootstrap
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids: [meerkat]
    # Default to tar.gz for Unix-y OSes. Windows users expect zip
    # archives — Expand-Archive is built into PowerShell and works
    # without extra tooling. format_overrides handles that delta.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - NOTICE
      - THIRD-PARTY-LICENSES.txt
      - README.md
    # Symlink mk -> meerkat at install time. For Unix tarball
    # users this is documented in docs/INSTALL.md; for Windows
    # users a copy of meerkat.exe to mk.exe (or a mk.cmd shim)
    # is recommended in the same doc.

  # meerkat-bootstrap publishes as a bare standalone binary rather
  # than a tar.gz/zip archive: it's a single small file with no
  # accompanying LICENSE/NOTICE/THIRD-PARTY-LICENSES.txt bundle of
  # its own (those already ship in the `meerkat` archive above, and
  # meerkat-bootstrap's own module graph is a strict subset), so there
  # is nothing an archive would add — a downstream operator running
  # the one documented bootstrap command can `curl`/`gh release
  # download` this file directly and chmod +x it, no unpacking step.
  # `formats: [binary]` is goreleaser's standalone-binary publishing
  # mode; it still participates in `checksum:` and `sboms:` below like
  # any other archive.
  - id: bootstrap
    ids: [meerkat-bootstrap]
    formats: [binary]
    name_template: >-
      meerkat-bootstrap_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

# SPDX SBOM per artifact via syft (must be on PATH; CI installs it
# in the release job's before_script). One .sbom.json per archive
# (the `meerkat` tar.gz/zip), one per standalone binary (the
# meerkat-bootstrap build above), and one for the source tree.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - '${artifact}.sbom.json'
  - id: bootstrap-binary
    ids: [bootstrap]
    artifacts: binary
    documents:
      - 'meerkat-bootstrap_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Os "windows" }}.exe{{ end }}.sbom.json'
  - id: source
    artifacts: source
    documents:
      - '{{ .ProjectName }}_{{ .Version }}_source.sbom.json'

# Sign the checksums file (and therefore, transitively, every
# artifact whose hash is in it) with cosign in keyless mode. The
# release workflow sets id-token: write so cosign auto-detects the
# ambient GitHub OIDC token and exchanges it for a Fulcio cert; the
# signature, certificate, and Rekor inclusion proof all land in a
# single Sigstore bundle (verifiable offline — no live call to Rekor
# needed at verify time). Cosign v3 requires --bundle for sign-blob;
# the old --output-signature/--output-certificate flags were dropped.
#
# Verification (consumer side):
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github.com/zegit-zoo/meerkat/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --bundle meerkat_<v>_checksums.txt.sigstore.json \
#     meerkat_<v>_checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  # GitHub owner/repo is auto-detected from the git remote (origin url).
  draft: false
  replace_existing_draft: true
  header: |
    ## meerkat {{ .Version }}

    Built {{ .Date }}.
  footer: |
    ---

    Run `mk version` to see the knowledge-base commit embedded in this
    build.

    Third-party licenses for statically linked dependencies are
    included in each archive as `THIRD-PARTY-LICENSES.txt`.

    Converging a downstream fork onto this release? `meerkat-bootstrap`
    (a standalone binary in this release's assets) installs a verified
    upstream release independently of whatever updater your existing
    binary understands — see
    docs/design/upstream-migration.md#converging-from-a-downstream-fork.

# Distribution: tagged releases publish cross-built tarballs to the
# GitHub Releases page. First-time install is manual (see README).
# Subsequent updates flow through `mk update`.
# (No Homebrew tap — keeps the supply chain to one repo.)

name: CI
# Runner routing: the org variable CI_RUNNER selects the self-hosted ARC pool and,
# because that pool sets ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER, the job container too.
# Unset (the default) means GitHub-hosted with no container. CI_IMAGE optionally
# overrides the image. Jobs left on a literal ubuntu-latest are held back on purpose
# (docker, services:, chromium, gh CLI, GitHub Pages) -- see flux-config ADR 0011 R9.
# Pull requests from forks never take the self-hosted route: that pool is shared, and
# fork code must not run on it (meerkat-mob#59). The default image is pinned by digest
# so a re-pushed tag cannot change what runs; Dependabot does not see this expression,
# so bump tag and digest together by hand.


on:
  push:
    # The default branch is master (renamed from main on 2026-09-28); both are
    # listed so push CI keeps running whichever name a merge lands on.
    branches: ["master", "main"]
  pull_request:
  # Dispatched on master by dependabot-automerge.yml after it merges: that merge
  # is made with GITHUB_TOKEN, so it triggers no push run of its own.
  workflow_dispatch:

# Default GITHUB_TOKEN scope for every job below: none of them push,
# tag, comment, or upload anything — they only read the checked-out
# repo and run local analysis/tests. Read-only top-level default; no
# job needs to escalate this.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync kb content
        run: make sync

      # No install step: `make lint` installs the pinned golangci-lint
      # (Makefile: GOLANGCI_LINT_VERSION) into .tools/ and runs it from
      # there. The Makefile is the single pin — this job, release.yml's
      # `verify` job and the pre-commit hook all run that same binary.
      - name: Lint
        run: make lint

      # .golangci.yml is otherwise schema-checked only by a commit hook
      # that fires when the file changes (#80 review).
      - name: Lint config
        run: make lint-config

      # The Dockerfile's Go pin must match go.mod's toolchain; nothing
      # else reads it (#80 review).
      - name: Go toolchain pins agree
        run: make toolchain-check

      - name: Check go.mod / go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || \
            (echo "ERROR: go.mod/go.sum out of sync — run go mod tidy" && exit 1)

      - name: Docs check
        run: make docs-check

      # The operator CRDs and deep-copy methods are generated from
      # internal/operator/api (meerkat-mob#10).
      - name: Operator CRDs check
        run: make crds-check

  test:
    name: Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage (enforce floor)
        run: make cover-check

  # The operator's reconciler and webhook against a real kube-apiserver
  # (meerkat-mob#10). `make test` skips TestEnvtest without the envtest
  # binaries, so this job is where it runs.
  envtest:
    name: Operator envtest
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Operator tests against a real API server
        run: make test-envtest

  vuln:
    name: Vulnerability scan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: make vuln

  # release.yml's `verify` job runs this same `make gosec` as a release gate.
  gosec:
    name: gosec
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # No sync step: the gosec target already depends on `sync`, so the
      # embed dirs are populated before the scan walks them.
      - name: gosec
        run: make gosec

  # The commit-stage hygiene hooks (end-of-file, whitespace, YAML, merge
  # markers, large files) have no job of their own, so a commit made
  # without hooks would skip them entirely (#80 review). Literal
  # ubuntu-latest: pre-commit needs Python and pipx, which the ARC job
  # container does not promise.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Hygiene hooks over the whole tree
        env:
          PRE_COMMIT: pipx run --spec pre-commit==4.6.2 pre-commit
        run: make hygiene

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: npx --yes markdownlint-cli@0.45.0 --config .markdownlint.yaml '**/*.md' --ignore node_modules

  # charts/meerkat: helm lint --strict and helm template | kubeconform for
  # the defaults and every charts/meerkat/ci/*-values.yaml, plus a schema
  # negative case (Makefile: chart-check). No setup action: helm and
  # kubeconform come from their release tarballs, each pinned by version
  # and sha256, the same posture as the SHA-pinned actions above. Literal
  # ubuntu-latest: the tarballs are linux-amd64, and kubeconform fetches
  # schemas from GitHub, which the ARC pool's egress does not promise.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.22.0
      HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install helm and kubeconform (pinned, checksum-verified)
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          echo "$bin" >> "$GITHUB_PATH"

      - name: Lint, render and validate the chart
        run: make chart-check CHART_TOOLS_REQUIRED=1

  gitleaks:
    name: gitleaks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan for secrets
        run: make gitleaks

  # Opt-in conformance against real S3-compatible stores. The unit tests
  # above run against in-memory fakes; this job proves the assumptions
  # those fakes encode (ETags, If-Match on reads, conditional writes,
  # pagination) against each provider, and fails when a provider's
  # observed behaviour drifts from the table in
  # docs/design/object-stores.md. Versity Gateway replaced MinIO on
  # 2026-09-25, when MinIO's public container images were withdrawn.
  s3-conformance:
    name: Object store conformance (${{ matrix.provider }})
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    container: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER && (vars.CI_IMAGE || 'gitea.langenoja.se/zegit-zoo/zegit-arc-runner:2.337.0-ci2@sha256:af9d54c83a2f5ca64a1e26568d97c9480c7338e4605736467ea44a5c2b36ae2a') || '' }}
    strategy:
      fail-fast: false
      matrix:
        provider: [garage, versitygw]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync kb content
        run: make sync

      - name: Start ${{ matrix.provider }}
        run: |
          scripts/${{ matrix.provider }}-up.sh > "$RUNNER_TEMP/s3.env"
          # The credentials are ephemeral (they exist only inside the
          # container this job started), so exporting them here is safe.
          sed 's/^export //' "$RUNNER_TEMP/s3.env" | tr -d '"' >> "$GITHUB_ENV"

      - name: Conformance tests
        run: go test -race -count=1 -run 'S3Conformance' -v ./internal/contentsource/ ./internal/memory/

      - name: Stop ${{ matrix.provider }}
        if: always()
        run: scripts/${{ matrix.provider }}-up.sh down

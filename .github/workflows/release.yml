name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Restrictive top-level default: neither job inherits write access or
# the OIDC token unless it declares its own `permissions:` below.
permissions:
  contents: read

jobs:
  verify:
    name: Full gate
    runs-on: ubuntu-latest
    # Lint/test/scan only — never pushes, tags, or signs. No id-token needed.
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync kb content
        run: make sync

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make test-cover

      - name: govulncheck
        run: make vuln

      - name: gosec
        run: make gosec

      - name: gitleaks
        run: make gitleaks

  goreleaser:
    name: GoReleaser
    needs: verify
    runs-on: ubuntu-latest
    # Only this job creates the GitHub Release and mints the cosign
    # OIDC token — both are scoped here, not at the workflow level.
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # cosign keyless OIDC (Fulcio)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          KB_COMMIT: none

  docker:
    name: Build, sign & push OCI image
    needs: verify
    runs-on: ubuntu-latest
    # Independent of the goreleaser job above — same binary-build inputs
    # (see Dockerfile), different artifact type (OCI image vs. tarballs).
    # Only this job needs packages: write (ghcr.io push) alongside the
    # id-token used by cosign's keyless OIDC flow.
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (Fulcio)
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute build metadata
        id: vars
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (linux/arm64 emulation on the amd64 runner)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/zegit-zoo/meerkat
          # {{version}}/{{major}}.{{minor}} both come from the vX.Y.Z tag
          # this workflow triggers on (see the `on.push.tags` filter
          # above) — no separate semver parsing needed. `latest` comes
          # from the action's default `latest=auto` flavor, which tags
          # it on semver tag events; an explicit raw rule here would
          # emit `latest` twice (v0.11.0's docker job failed the tag
          # assertion on exactly that duplication).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      # Guards the published-tag contract documented in
      # docs/CONTAINER.md / README.md / docs/RELEASE.md: a vX.Y.Z git
      # tag must publish exactly the three image aliases X.Y.Z, X.Y,
      # and latest — no leading `v`. Fails loudly (rather than
      # silently pushing an undocumented tag set) if metadata-action's
      # `tags` output ever changes shape upstream. Dependency-free
      # shell only — no jq/yq.
      - name: Assert computed image tags match the documented contract
        env:
          COMPUTED_TAGS: ${{ steps.meta.outputs.tags }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${REF_NAME#v}"
          major_minor="${version%.*}"
          image="ghcr.io/zegit-zoo/meerkat"

          expected="$(printf '%s:%s\n%s:%s\n%s:latest' "$image" "$version" "$image" "$major_minor" "$image")"

          if [ "$COMPUTED_TAGS" != "$expected" ]; then
            echo "::error::docker/metadata-action produced a tag set that no longer matches the documented contract (docs/CONTAINER.md, README.md, docs/RELEASE.md)."
            echo "expected:"
            echo "$expected"
            echo "got:"
            echo "$COMPUTED_TAGS"
            exit 1
          fi

          echo "Computed image tags match the documented contract:"
          echo "$COMPUTED_TAGS"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Multi-arch build + push in one step. --provenance/--sbom are
      # BuildKit-native attestations (no separate syft invocation
      # needed — BuildKit's default SBOM scanner,
      # docker/buildkit-syft-scanner, wraps Anchore's syft), pushed
      # alongside the manifest list as OCI referrers. See
      # docs/CONTAINER.md#sbom-and-provenance for how to inspect them.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
            KB_COMMIT=none

      # Signs the manifest list digest (arch-independent) — a single
      # signature covers every platform's image. Keyless: cosign
      # auto-detects the ambient GitHub OIDC token (id-token: write
      # above) and exchanges it for a short-lived Fulcio cert; the
      # signature + Rekor inclusion record land in the public
      # transparency log. See docs/RELEASE.md's "Verifying the
      # container image" section for the consumer-side `cosign verify`.
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/zegit-zoo/meerkat@${{ steps.build.outputs.digest }}"

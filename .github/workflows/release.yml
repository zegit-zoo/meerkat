name: Release
# Runner routing: every job here runs on a literal GitHub-hosted ubuntu-latest with no
# container, on purpose. Unlike ci.yml, this workflow ignores the org variables
# CI_RUNNER and CI_IMAGE: goreleaser and docker hold id-token: write, and mk update
# and the Homebrew tap accept any signature from release.yml@refs/tags/v*, so a
# variable change must not be able to move signing onto the shared self-hosted pool
# or into a container pulled from a third-party registry (meerkat-mob#59).


on:
  push:
    tags:
      - "v*.*.*"

# Restrictive top-level default: neither job inherits write access or
# the OIDC token unless it declares its own `permissions:` below.
permissions:
  contents: read

jobs:
  verify:
    name: Full gate
    runs-on: ubuntu-latest
    # Lint/test/scan only — never pushes, tags, or signs. No id-token needed.
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # A release is only ever cut from master. The tag ruleset checks the
      # target commit's signature, and GitHub signs any commit made through
      # the API or a PR merge, so a tag on an unmerged branch commit would
      # otherwise be built and signed as release.yml@refs/tags/vX.Y.Z
      # (meerkat-mob#36). goreleaser and docker both `needs: verify`, so
      # failing here publishes nothing.
      - name: Tag commit must be on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/master; then
            echo "::error::${GITHUB_REF_NAME} points at ${tag_commit}, which is not on master. Releases are cut from master only."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} (${tag_commit}) is on master."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync kb content
        run: make sync

      # No install step: `make lint` installs the pinned golangci-lint
      # (Makefile: GOLANGCI_LINT_VERSION) into .tools/ and runs it from
      # there — same single pin ci.yml's Lint job uses.
      - name: Lint
        run: make lint

      - name: Test with coverage
        run: make test-cover

      - name: govulncheck
        run: make vuln

      - name: gosec
        run: make gosec

      - name: gitleaks
        run: make gitleaks

  goreleaser:
    name: GoReleaser
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    # Only this job creates the GitHub Release and mints the cosign
    # OIDC token — both are scoped here, not at the workflow level.
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # cosign keyless OIDC (Fulcio)
      attestations: write  # SLSA build provenance for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          # Exact pin: the action checks the downloaded binary only against
          # goreleaser's own checksums file, so a floating range would let a
          # new upstream release run in the signing job unreviewed. Dependabot
          # does not bump this input; raise it by hand (meerkat-mob#60).
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          KB_COMMIT: none

      # The checksums file is named from goreleaser's {{ .Version }}, which
      # drops the tag's leading `v` (.goreleaser.yaml `checksum:`), so the
      # path is derived here and checked before the attestation reads it.
      # v0.18.0 shipped without attestations because this used the raw tag.
      - name: Locate checksums file
        id: sums
        run: |
          f="dist/meerkat_${GITHUB_REF_NAME#v}_checksums.txt"
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty"
            ls dist
            exit 1
          fi
          echo "path=$f" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for every artifact listed in the checksums
      # file (archives, bootstrap binaries, source archive, SBOMs), stored
      # as a GitHub attestation: `gh attestation verify <file> -R zegit-zoo/meerkat`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ steps.sums.outputs.path }}

  docker:
    name: Build, sign & push OCI image
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    # Independent of the goreleaser job above — same binary-build inputs
    # (see Dockerfile), different artifact type (OCI image vs. tarballs).
    # Only this job needs packages: write (ghcr.io push) alongside the
    # id-token used by cosign's keyless OIDC flow.
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (Fulcio)
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute build metadata
        id: vars
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # The commit date, as goreleaser's {{.CommitDate}} embeds in the
          # release binaries, so the image binary reports the same date.
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `latest` (and nothing else) must only move forward: tagging a patch
      # for an older line, e.g. v0.15.1 after v0.16.0, must not repoint it.
      - name: Is this the highest release tag?
        id: latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          highest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' \
            | sort -V | tail -n 1)"
          if [ "$highest" = "$REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "highest release tag: $highest; this tag: $REF_NAME"

      - name: Set up QEMU (linux/arm64 emulation on the amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/zegit-zoo/meerkat
          # {{version}}/{{major}}.{{minor}} both come from the vX.Y.Z tag
          # this workflow triggers on (see the `on.push.tags` filter
          # above) — no separate semver parsing needed. `latest=auto`
          # would tag every semver push, an older line's patch included,
          # so it is off and the raw rule adds `latest` only for the
          # highest tag (step above). With the flavor off, the raw rule
          # cannot duplicate it (v0.11.0's docker job failed the tag
          # assertion on exactly that duplication).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      # Guards the published-tag contract documented in
      # docs/CONTAINER.md / README.md / docs/RELEASE.md: a vX.Y.Z git
      # tag must publish exactly the image aliases X.Y.Z, X.Y, and,
      # when it is the highest release tag, latest — no leading `v`. Fails loudly (rather than
      # silently pushing an undocumented tag set) if metadata-action's
      # `tags` output ever changes shape upstream. Dependency-free
      # shell only — no jq/yq.
      - name: Assert computed image tags match the documented contract
        env:
          COMPUTED_TAGS: ${{ steps.meta.outputs.tags }}
          REF_NAME: ${{ github.ref_name }}
          IS_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail

          version="${REF_NAME#v}"
          major_minor="${version%.*}"
          image="ghcr.io/zegit-zoo/meerkat"

          expected="$(printf '%s:%s\n%s:%s' "$image" "$version" "$image" "$major_minor")"
          if [ "$IS_LATEST" = "true" ]; then
            expected="$(printf '%s\n%s:latest' "$expected" "$image")"
          fi

          if [ "$COMPUTED_TAGS" != "$expected" ]; then
            echo "::error::docker/metadata-action produced a tag set that no longer matches the documented contract (docs/CONTAINER.md, README.md, docs/RELEASE.md)."
            echo "expected:"
            echo "$expected"
            echo "got:"
            echo "$COMPUTED_TAGS"
            exit 1
          fi

          echo "Computed image tags match the documented contract:"
          echo "$COMPUTED_TAGS"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Multi-arch build + push in one step. --provenance/--sbom are
      # BuildKit-native attestations (no separate syft invocation
      # needed — BuildKit's default SBOM scanner,
      # docker/buildkit-syft-scanner, wraps Anchore's syft), pushed
      # alongside the manifest list as OCI referrers. See
      # docs/CONTAINER.md#sbom-and-provenance for how to inspect them.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
            KB_COMMIT=none

      # Signs the manifest list digest (arch-independent) — a single
      # signature covers every platform's image. Keyless: cosign
      # auto-detects the ambient GitHub OIDC token (id-token: write
      # above) and exchanges it for a short-lived Fulcio cert; the
      # signature + Rekor inclusion record land in the public
      # transparency log. See docs/RELEASE.md's "Verifying the
      # container image" section for the consumer-side `cosign verify`.
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/zegit-zoo/meerkat@${{ steps.build.outputs.digest }}"

  # The Helm chart, versioned in lockstep with the app: charts/meerkat in git
  # carries the placeholder 0.0.0-dev, and this job packages it as chart
  # version X.Y.Z with appVersion X.Y.Z (no leading `v`, like the image
  # tags), so a release can never ship a chart that points at an older
  # image. It pushes oci://ghcr.io/zegit-zoo/charts/meerkat:X.Y.Z, signs the
  # digest with cosign (keyless, the same release.yml@refs/tags identity as
  # the image) and attaches SLSA provenance (meerkat-mob#10).
  #
  # No `environment:` of its own: a job that starts after the approval would
  # ask for a second one. It needs both approved jobs, so it runs only once
  # a release manager other than the tagger has approved this release, and
  # only after the image it defaults to exists.
  chart:
    name: Package, sign & push Helm chart
    needs: [goreleaser, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # cosign keyless OIDC (Fulcio) and the attestation
      packages: write      # push to ghcr.io
      attestations: write  # SLSA build provenance for the chart artifact
    env:
      # Same pin as ci.yml's chart job; raise both together.
      HELM_VERSION: v3.22.0
      HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
      CHART_REPO: ghcr.io/zegit-zoo/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install helm (pinned, checksum-verified)
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C "$bin" --strip-components=1 linux-amd64/helm
          echo "$bin" >> "$GITHUB_PATH"

      - name: Package the chart at the release version
        id: pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm lint --strict charts/meerkat
          helm package charts/meerkat --version "$version" --app-version "$version" -d "$RUNNER_TEMP/chart"
          f="$RUNNER_TEMP/chart/meerkat-${version}.tgz"
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty"
            ls "$RUNNER_TEMP/chart"
            exit 1
          fi
          # The packaged Chart.yaml must carry the release on both fields.
          meta="$(tar -xzOf "$f" meerkat/Chart.yaml)"
          echo "$meta" | grep -qx "version: ${version}" || { echo "::error::packaged chart version is not ${version}"; exit 1; }
          echo "$meta" | grep -qx "appVersion: ${version}" || { echo "::error::packaged appVersion is not ${version}"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # For cosign and the attestation's push-to-registry, which read only the
      # Docker config (~/.docker/config.json). `helm registry login` below
      # writes helm's own registry config, so with that alone the chart was
      # pushed but its signature upload got a 401 and 0.20.0 shipped unsigned
      # and unattested (#205). Helm keeps its own login.
      - name: Log in to ghcr.io (cosign, attestation)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_PATH: ${{ steps.pkg.outputs.path }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          out="$(helm push "$CHART_PATH" "oci://${CHART_REPO}" 2>&1)"
          echo "$out"
          digest="$(echo "$out" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p')"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Signs the chart's manifest digest, so the signature covers exactly
      # the pushed artifact. Flux's OCIRepository `verify:` and `cosign
      # verify` check it (docs/RELEASE.md, charts/meerkat/README.md).
      - name: Sign chart (keyless)
        run: cosign sign --yes "${CHART_REPO}/meerkat@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/meerkat
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Dispatches the Homebrew tap's bump.yml for this release, so brew picks it
  # up within minutes rather than at the tap's next 6-hourly cron. The built-in
  # GITHUB_TOKEN cannot dispatch a workflow in another repository, so this job
  # mints a short-lived token from a GitHub App that holds only Actions: write,
  # installed on zegit-zoo/homebrew-tap alone (docs/RELEASE.md has the setup).
  # The token can start bump.yml and nothing else: the bump still cosign-
  # verifies this release against release.yml@refs/tags/vX.Y.Z and runs brew
  # test before it pushes, so the dispatch grants no path to publish an
  # unverified formula. Until the App exists the variable is unset and the job
  # is skipped; the cron still picks the release up.
  #
  # No `environment:` for the same reason as the chart job, and no
  # permissions: the job reads nothing from this repo and signs nothing.
  homebrew:
    name: Dispatch Homebrew tap bump
    needs: goreleaser
    if: vars.TAP_DISPATCH_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # bump.yml pins the formula to the tag it is given, so dispatching a
      # patch for an older line (v0.19.1 after v0.20.0) would downgrade brew.
      # No checkout here, hence the URL instead of `origin`.
      - name: Is this the highest release tag?
        id: latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          highest="$(git ls-remote --tags --refs https://github.com/zegit-zoo/meerkat.git 'refs/tags/v*' \
            | sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' \
            | sort -V | tail -n 1)"
          if [ "$highest" = "$REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${REF_NAME} is not the highest release tag (${highest}); not dispatching the tap bump."
          fi
          echo "highest release tag: $highest; this tag: $REF_NAME"

      - name: Mint a tap dispatch token
        if: steps.latest.outputs.latest == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.TAP_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.TAP_DISPATCH_PRIVATE_KEY }}
          owner: zegit-zoo
          repositories: homebrew-tap
          permission-actions: write

      - name: Dispatch bump.yml
        if: steps.latest.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run bump.yml --repo zegit-zoo/homebrew-tap -f tag="$TAG"

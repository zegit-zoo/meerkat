# content-source.example.yaml
#
# Copy to `content-source.yaml` (gitignored or committed per deployment).
# Read for two different purposes, depending on where it lives:
#   - repo root, by `make sync` / the release build hook, at BUILD time:
#     resolves the source and embeds it in the binary. type: none | local |
#     git | submodule.
#   - <user config dir>/meerkat/, the working directory, or
#     --content-source/MEERKAT_CONTENT_SOURCE, read by the meerkat/mk
#     binary itself at RUNTIME (see the README's resolution order): serves
#     the source directly, no rebuild. type: none | local | url | gcs.
# git/submodule need git and a working tree, so they're build-time only.
# url and gcs need no build step, so they're runtime-only (`make sync`
# won't fetch them). See docs/design/content-sources.md and
# docs/design/multi-collection.md.
#
# The file has two shapes, and exactly one of them:
#   content:      one source (below) — the original schema, unchanged.
#   collections:  several named sources, all mounted at once (bottom of
#                 this file). Each entry uses the same keys as `content:`.
# Setting both is an error, not a merge.
#
# Absent file, or type: none -> build (or serve, at runtime) with the
# committed empty placeholders (the open-source default; the public repo
# ships no content-source.yaml).
#
# Credentials: `local` needs none at all — this is the default for most
# users, who build from their own knowledge-base directory on disk. A
# private GitHub repo (type: git, host: github) will automatically use a
# cached `gh` CLI token if one is present — nothing to configure. GitLab (or
# any other host) has no credential borrowing built in: give it a full clone
# URL / SSH spec, or rely on your normal git credential configuration
# (credential helper, SSH agent, etc.) for private access. `url` needs none
# either — an unauthenticated HTTPS GET, verified by the required sha256
# instead. `gcs` uses Application Default Credentials (see below): there is
# no key file to configure, deliberately.

content:
  # type: none | local | git | submodule | url | gcs
  type: local

  # --- type: local (build time + runtime) ------------------------------------
  # The default: build (or serve) from a local content directory, no
  # credentials of any kind required. Most users point this at their own
  # knowledge-base material, so this is the happy path.
  path: ../meerkat-kb            # content root, relative to repo root (build) or this file's directory (runtime), or absolute

  # --- type: git (build time only) -------------------------------------------
  # repo: your-org/meerkat-kb        # owner/repo slug (with host below), or a full clone URL
  # host: github                     # github | gitlab — github gets a cached gh token automatically;
  #                                   # gitlab (or any other host) relies on your own git credentials
  # ref: v1.2.0                      # tag or commit SHA (pin for reproducible builds; a branch warns)

  # --- type: submodule (build time only) -------------------------------------
  # submodule: kb                  # path of the content submodule (legacy default)

  # --- type: url (runtime only) -----------------------------------------------
  # Fetches an HTTPS .tar.gz of the content-repo layout below (same shape
  # local/git/submodule resolve to). sha256 is REQUIRED, not just
  # recommended: it's verified before anything is extracted, and it keys
  # the on-disk cache at <user cache dir>/meerkat/content/url/<sha256>/ —
  # content is immutable by digest, so a restart that already has this
  # digest cached does no network I/O at all. `make sync` does not resolve
  # this type; it's fetched by the meerkat/mk binary itself, at startup.
  # url: https://example.com/kb/v1.2.3.tar.gz
  # sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

  # --- type: gcs (runtime only) -----------------------------------------------
  # Loads content from a Google Cloud Storage bucket in one of two modes:
  # a single .tar.gz object, or an object prefix served as a directory
  # tree. Exactly one of object: / prefix:.
  #
  # bucket: my-org-knowledge          # bucket NAME (not a gs:// URL, not a path)
  #
  #   # (a) bundle mode — one .tar.gz, the GCS analogue of type: url:
  # object: bundles/kb-v1.2.3.tar.gz
  # generation: 1748112233445566      # OPTIONAL: pin one exact object generation.
  #                                   # Set it and the current generation is never
  #                                   # consulted — a later overwrite cannot change
  #                                   # what this deployment serves. Leave it out and
  #                                   # the object's current generation is resolved
  #                                   # once at startup.
  # sha256: "..."                     # OPTIONAL for gcs (the generation already pins
  #                                   # the bytes); when set it is verified before
  #                                   # anything is extracted, exactly as for type: url.
  #
  #   # (b) prefix mode — every object under a prefix, as a directory tree:
  # prefix: kb/live/                  # the prefix is stripped; kb/live/wiki/x.md
  #                                   # is served as wiki/x.md
  #
  # Caching: bundle mode caches at
  #   <user cache dir>/meerkat/content/gcs/<hash(bucket,object)>/<generation>/
  # and prefix mode at .../<hash(bucket,prefix)>/<listing-fingerprint>/,
  # where the fingerprint covers every listed object's (name, generation).
  # Either way the cache key names immutable content: a restart on the same
  # generation re-uses the cache, and any write under the prefix (add,
  # overwrite, delete) produces a new key. Objects are fetched with a
  # conditional read (ifGenerationMatch), so the bytes served can only ever
  # be the generation the cache entry is named after.
  #
  # Credentials: Application Default Credentials only — Workload Identity
  # Federation, a GKE/Cloud Run/GCE service account, an impersonated
  # principal, or `gcloud auth application-default login` for a developer.
  # There is deliberately NO key-file field in this schema: meerkat never
  # reads or accepts a static service-account key. Grant the principal
  # storage.objects.get (and storage.objects.list for prefix mode).

  # Layout: where each artifact lives WITHIN the resolved source.
  # Defaults shown; override only if your content repo differs.
  layout:
    wiki:      wiki                  # markdown pages    -> internal/kb/content/
    sources:   ingestion/sources.yaml # source registry  -> internal/sources/etc/sources.yaml
    prompts:   ingestion/prompts     # per-source prompts -> internal/sources/etc/prompts/
    templates: templates             # page templates    -> internal/sources/etc/templates/

  # --- memory: a WRITABLE store for this collection (runtime, MCP only) ------
  #
  # Enables the mk_save_memory MCP tool for this collection: agents save
  # personal / team / global memory documents, which become searchable
  # immediately (no restart). See docs/design/memory.md.
  #
  # ABSENT (the default) the collection is READ-ONLY and the tool is not
  # offered at all — which is what every configuration written before this
  # existed gets.
  #
  # The store deliberately sits OUTSIDE the wiki tree above: it holds a
  # _staging/ area for proposals that are not authorized yet, and anything
  # under wiki/ would be indexed on the next restart — turning "pending
  # review" into "published". Nothing here is served except through
  # meerkat's own overlay, which loads live documents only.
  #
  # memory:
  #   type: local                    # local | gcs
  #
  #   # --- type: local ---------------------------------------------------
  #   path: memory                   # relative to the collection's content
  #                                  # directory (a SIBLING of wiki/), or
  #                                  # absolute. Default: "memory".
  #                                  # MUST be absolute when the content
  #                                  # source is type: url or type: gcs —
  #                                  # those resolve to a content-addressed
  #                                  # cache that is replaced on every content
  #                                  # change, so a relative path would lose
  #                                  # the memories. Refused at load time.
  #                                  # Writes are temp-file + fsync + atomic
  #                                  # rename; optimistic locking is a mutex,
  #                                  # so this backend is SINGLE-PROCESS. Two
  #                                  # replicas sharing a volume want gcs.
  #
  #   # --- type: gcs -----------------------------------------------------
  #   # bucket: my-org-knowledge     # bucket NAME; ADC only, as everywhere
  #   # prefix: kb/memory/           # required (an empty prefix would name
  #   #                              # the whole bucket)
  #   # Writes use generation preconditions (ifGenerationMatch: 0 to create,
  #   # the matched generation to update), evaluated server-side — so several
  #   # replicas can share one store and still never lose a write.
  #   # Grant storage.objects.get/list/create/delete on the prefix.
  #
  # Who may write what is the auth: block's business (see the bottom of this
  # file): personal-write / team-write / global-write, per collection. An
  # unauthorized team or global write becomes a pending artifact under
  # <store>/_staging/ instead of being refused, and the tool's response says
  # where it landed.

  # --- description + update: what this collection is, and how to contribute --
  #
  # Two optional keys that describe the COLLECTION rather than the bytes it
  # resolves to. Both are surfaced to agents through collection discovery, so
  # together they are how an agent learns what this knowledge base is for and
  # how to add to it. See docs/design/update-contract.md.
  #
  # description: One or two sentences of context — what's in here, who owns
  # it, what it's for. A name is an identifier, not an explanation. Max 500
  # characters: it is rendered into an agent's context every time collections
  # are listed, so long-form guidance belongs in update.instructions below.
  #
  # description: Engineering handbook — conventions, onboarding, how we work.
  #
  # update: the SANCTIONED CONTRIBUTION PATH. Absent (the default) means
  # there is none, and agents are told exactly that instead of guessing —
  # which is what every configuration written before this existed gets.
  #
  # It is DECLARED, never inferred from the type: above. A collection served
  # from a GCS mirror is very often maintained in a git repository the
  # serving process cannot even reach: the serving address and the
  # contribution address are different by design, and only you know which is
  # which. meerkat reasons about type: in exactly one place — it REFUSES
  # method: direct at load time on a backend a write cannot land in (type:
  # url, type: gcs with object:, type: none, type: git/submodule), because
  # such a write would go nowhere, or into a content-addressed cache that the
  # next content change replaces.
  #
  #   # (a) method: merge-request — a git-authoritative KB, reviewed by a
  #   #     human. LEGAL ON ANY BACKEND, including the read-only ones.
  # update:
  #   method: merge-request
  #   repo: https://github.com/example-org/handbook.git
  #                                  # https://, ssh://, or git@host:owner/repo.
  #                                  # An "owner/repo" slug is refused: it names
  #                                  # no host, and the contribution repo need
  #                                  # not be on the host serving the content.
  #                                  # NEVER embed credentials — the contract is
  #                                  # rendered to every caller who can see this
  #                                  # collection, so a token here is a token
  #                                  # handed to them. Refused at load time.
  #   host: github                   # github | gitlab | other (default: other).
  #                                  # Selects the CLI mechanics an AGENT reaches
  #                                  # for (gh / glab / plain git); meerkat never
  #                                  # contacts it.
  #   branch: main                   # the merge request's target (default: main)
  #   path: wiki                     # where pages live in the CONTRIBUTION repo.
  #                                  # NOT derived from layout.wiki above, which
  #                                  # describes the serving mirror — the two
  #                                  # repos may be laid out differently.
  #   instructions: |                # free-text, agent-facing: the skill you'd
  #                                  # otherwise explain to every contributor by
  #                                  # hand. Fork-vs-branch policy, page format,
  #                                  # what to run before proposing.
  #     Fork example-org/handbook to your own account and open the pull
  #     request from that fork; the upstream repo does not take branches.
  #     One page per pull request.
  #
  #   # (b) method: direct — this collection's own backend IS the source of
  #   #     truth and may be written to. Valid ONLY for type: local (a
  #   #     directory) or type: gcs with prefix: (an object prefix) — the
  #   #     same notion of "writable" the memory: block above uses.
  #   #     repo/host/branch/path are refused here: there is no contribution
  #   #     repo to name. instructions: is still allowed.
  # update:
  #   method: direct
  #   instructions: |
  #     Pages are Markdown with OKF frontmatter, under wiki/.
  #
  #   # (c) method: none — identical to omitting the block. Write it to say
  #   #     "there is deliberately no contribution path here" out loud.
  # update:
  #   method: none
  #
  # WHAT A CALLER IS ACTUALLY TOLD depends on what that caller may do, so two
  # people can get two different answers for the same collection (hosted MCP
  # only — the CLI, stdio MCP and `mk http serve` have no policy in force and
  # therefore see the declared contract unchanged):
  #
  #   declared direct        + global-write or admin  -> direct
  #   declared direct        + some other write cap   -> propose it with
  #                                                      mk_save_memory, staged
  #                                                      for review (needs the
  #                                                      memory: block above)
  #   declared direct        + read only              -> none, and why
  #   declared merge-request + anyone who can see it  -> merge-request
  #   declared none          + anyone                 -> none
  #
  # Capabilities only ever NARROW a declared contract, never widen it: an
  # admin on a merge-request collection still opens a merge request.

# --- collections: several named sources at once (runtime) --------------------
#
# Instead of `content:` above, declare a list of named collections. Each
# entry takes exactly the keys `content:` takes (type/path/url/bucket/...
# plus its own layout:), with a `name:` on top. Backends are free to
# differ per collection.
#
# ORDER MATTERS. It is the order collections are listed in, searched in,
# and — for a page ID present in more than one — disambiguated in.
#
# Names must match [A-Za-z0-9][A-Za-z0-9_-]* (no colon: a name is also the
# "<collection>:" prefix of a qualified page ID).
#
# Then:
#   mk list --collections                  what's mounted
#   mk search "term"                       every collection, merged by score
#   mk search "term" --collection runbooks just one
#   mk show runbooks:incidents/paging      a page ID qualified by collection
#   mk show incidents/paging               tried in order; ambiguous is an error
#
# The FIRST collection additionally backs the surfaces that aren't
# collection-aware yet: `mk ingest`, the ingestion source registry, and
# shell completion.
#
# collections:
#   - name: runbooks
#     type: local
#     path: ../runbooks-kb
#     description: On-call runbooks — paging, escalation, and incident recovery.
#     update:
#       method: direct               # a directory this deployment owns and
#                                    # keeps writable; the write IS the update
#       instructions: |
#         One runbook per page, under wiki/runbooks/. Lead with the symptom,
#         then the check, then the fix.
#
#   - name: architecture
#     type: gcs
#     bucket: my-org-knowledge
#     object: bundles/architecture-v3.tar.gz
#
#   # A git-authoritative KB: served from a MIRROR (a bundle a pipeline
#   # publishes), maintained in a repository that is a different address
#   # entirely. method: merge-request is legal here precisely because the
#   # contract is declared rather than inferred from type: gcs.
#   - name: handbook
#     type: gcs
#     bucket: my-org-knowledge
#     prefix: handbook/live/
#     description: Engineering handbook — conventions, onboarding, how we work.
#     update:
#       method: merge-request
#       repo: https://github.com/example-org/handbook.git
#       host: github
#       branch: main
#       path: wiki
#       instructions: |
#         Fork example-org/handbook to your own account and open the pull
#         request from that fork. The upstream repo does not accept branches,
#         so `gh repo fork --remote` first, then push your branch to the fork
#         and `gh pr create --repo example-org/handbook --base main`.
#
#         One page per pull request, and never edit the bucket this
#         collection is served from: it is a mirror, and the next sync
#         overwrites anything written there.
#
#         Pages are Markdown with OKF frontmatter (id, title, type, category,
#         status, tags). Copy the closest existing page under wiki/ rather
#         than inventing a shape, and keep `id` equal to the page's path
#         under wiki/ without the .md suffix.
#
#         Before opening the PR, check the page parses and indexes:
#           mk list --kb-dir . --prefix <the id you chose>
#         Fill in `status:` honestly — `draft` is a fine thing to propose.
#
#   - name: team-notes
#     type: gcs
#     bucket: my-org-knowledge
#     prefix: notes/live/
#     memory:                        # this one accepts saved memories
#       type: gcs
#       bucket: my-org-knowledge
#       prefix: notes/memory/
#
#   - name: vendor-docs
#     type: url
#     url: https://example.com/kb/vendor-v2.tar.gz
#     sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
#     description: Vendor documentation, mirrored. Read-only.
#     update:
#       method: none                 # nothing to contribute to: it's a mirror
#                                    # of somebody else's documentation
#     layout:
#       wiki: docs

# --- auth: OIDC + collection authorization (runtime, hosted MCP only) --------
#
# Read ONLY by `mk mcp serve-http` (docs/design/hosted-mcp.md). Every
# other surface — the CLI, `mk mcp serve` on stdio, `mk http serve` —
# ignores it, so adding this block cannot change what they do. Absent, the
# hosted server is unauthenticated and serves every mounted collection to
# any caller, which is the same posture as the stdio server.
#
# May also live in a standalone file (same `auth:` key, same validation)
# passed as `mk mcp serve-http --auth-config policy.yaml`, for deployments
# where content config and access policy have different owners or
# lifecycles.
#
# Validation runs at LOAD time: an unknown capability, a rule with no
# collections, a non-https issuer, or rules with no providers fails the
# process rather than quietly granting nothing.
#
# auth:
#   # RFC 9728 resource identifier: the https URL clients reach this server
#   # at. Published as the protected-resource metadata's `resource`, and
#   # REQUIRED in every token's audience (an audience-unbound resource
#   # server accepts tokens minted for anyone else at the same IdP).
#   resource: https://mcp.example.com/mcp
#
#   # OpenID Connect issuers whose tokens are accepted. Discovery is
#   # generic (<issuer>/.well-known/openid-configuration + JWKS), so Entra
#   # ID, Google Workspace and Okta are configuration, not code. Discovery
#   # runs once at STARTUP: an unreachable issuer fails the process rather
#   # than producing intermittent 401s later.
#   #
#   # The presented token must be a signed JWT: an ID token, or a JWT
#   # access token minted for `resource:` as a custom API audience (Entra
#   # and Okta do this for a registered API). Google's OAuth access tokens
#   # are opaque, so a Google deployment audiences an ID token at the
#   # OAuth client ID instead. Opaque-token introspection is not supported.
#   providers:
#     - issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
#       audience: api://meerkat        # defaults to auth.resource above
#       claims:                        # which claim carries what
#         groups: groups               # "roles" for Entra app roles
#         email: preferred_username    # default "email"
#         tenant: tid                  # default "tid"
#       require_tenant: <tenant-id>    # optional: pin a multi-tenant issuer
#
#     - issuer: https://accounts.google.com
#       audience: <oauth-client-id>.apps.googleusercontent.com
#       claims: { groups: groups, email: email }
#
#   # Who may do what to which collection. EVERY matching rule contributes
#   # (union); there is no ordering, no first-match-wins, and no deny rule,
#   # so a rule's effect can be read without holding the whole document in
#   # your head. Narrowing access = deleting a rule.
#   #
#   # Selectors: subjects (exact), emails (case-insensitive), groups
#   # (any-of, case-insensitive), tenant, issuer. Any value WITHIN a
#   # selector matches; ALL selectors present must match. A rule with no
#   # selector matches every authenticated caller.
#   #
#   # Capabilities: read | personal-write | team-write | global-write | admin.
#   #
#   # `read` decides whether a collection is VISIBLE at all: one a caller
#   # can't read is absent from their tool descriptions, search results,
#   # listings, error messages and page-ID disambiguation, exactly as if it
#   # were never mounted.
#   #
#   # The three write capabilities gate mk_save_memory, one per scope
#   # (personal / team / global) — see the memory: block above and
#   # docs/design/memory.md. They are independent of `read`: a caller with
#   # only `read` is not offered the memory tool at all, and a caller with
#   # only `personal-write` is offered the memory tool and nothing else. A
#   # team or global write by someone who holds a DIFFERENT write
#   # capability is staged for review rather than refused.
#   #
#   # `admin` implies every capability, including ones added later.
#   rules:
#     - name: sre
#       groups: [sre, oncall]
#       collections: [runbooks, architecture]
#       capabilities: [read]           # the default when omitted
#
#     - name: hr
#       groups: [people-ops]
#       collections: [team-notes]
#       capabilities: [read, team-write]
#
#     - name: everyone-remembers
#       groups: [engineering]
#       collections: [team-notes]      # may save their own memories, and
#       capabilities: [read, personal-write]   # PROPOSE team/global ones
#
#     - name: knowledge-owners
#       groups: [knowledge-owners]
#       collections: [team-notes]
#       capabilities: [read, team-write, global-write]
#
#     - name: platform-admins
#       groups: [platform-admins]
#       collections: ["*"]             # every collection, including future ones
#       capabilities: [admin]
#
#     - name: everyone-authenticated
#       collections: [vendor-docs]     # no selector: anyone with a valid token
#
#   # Delegate authentication to a gateway that has already established
#   # identity. No token is checked and NOTHING is filtered — every mounted
#   # collection is readable by any caller that reaches the process. Cannot
#   # be combined with providers: above.
#   # allow_unauthenticated: false

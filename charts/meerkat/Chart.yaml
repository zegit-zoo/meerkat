apiVersion: v2
name: meerkat
description: >-
  meerkat knowledge-base server: the hosted MCP server (mk mcp serve-http)
  or the HTTP/OpenAPI server (mk http serve) from ghcr.io/zegit-zoo/meerkat.
type: application
# Placeholders. The chart is versioned in lockstep with meerkat: release.yml
# packages it as version X.Y.Z with appVersion X.Y.Z for git tag vX.Y.Z and
# publishes oci://ghcr.io/zegit-zoo/charts/meerkat:X.Y.Z. Do not bump these
# by hand. Installed from a checkout, the chart has no real default image
# tag: set image.tag (no leading "v": git tag v0.19.0 publishes
# ghcr.io/zegit-zoo/meerkat:0.19.0).
version: 0.0.0-dev
appVersion: "0.0.0-dev"
kubeVersion: ">=1.25.0-0"
home: https://github.com/zegit-zoo/meerkat
sources:
  - https://github.com/zegit-zoo/meerkat
keywords:
  - mcp
  - knowledge-base
  - meerkat
annotations:
  artifacthub.io/license: Apache-2.0

{{- /*
The operator's ServiceAccount and its cluster-wide permissions. The rules
come from files/operator/role.yaml, which controller-gen generates from the
+kubebuilder:rbac markers (`make crds`), so they cannot drift from the code.
*/ -}}
{{- if .Values.operator.enabled }}
{{- $role := .Files.Get "files/operator/role.yaml" | fromYaml }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meerkat.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meerkat.operator.labels" . | nindent 4 }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "meerkat.operator.fullname" . }}
  labels:
    {{- include "meerkat.operator.labels" . | nindent 4 }}
rules:
  {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "meerkat.operator.fullname" . }}
  labels:
    {{- include "meerkat.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "meerkat.operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "meerkat.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

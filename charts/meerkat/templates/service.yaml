{{- if eq (include "meerkat.serverEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meerkat.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ include "meerkat.servicePort" . }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "meerkat.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if .Values.operator.enabled }}
{{- $webhook := eq (include "meerkat.operator.webhookEnabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meerkat.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meerkat.operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "meerkat.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "meerkat.operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "meerkat.operator.serviceAccountName" . }}
      # The operator talks to the API server, so it needs its token (the
      # ServiceAccount itself turns automounting off for anything else).
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "meerkat.operator.image" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            # One replica reconciles at a time; every replica serves the webhook.
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --server-image={{ .Values.operator.serverImage | default (include "meerkat.image" .) }}
            - --allowed-images={{ join "," .Values.operator.allowedImages }}
            {{- if $webhook }}
            - --webhook-port={{ .Values.operator.webhook.port }}
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            {{- else }}
            - --webhooks=false
            {{- end }}
            {{- with .Values.operator.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if $webhook }}
            - name: webhook
              containerPort: {{ .Values.operator.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if $webhook }}
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if $webhook }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ include "meerkat.operator.certSecret" . }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

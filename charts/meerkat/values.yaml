# Default values for the meerkat chart. See README.md for the full table.
#
# Secrets never go in this file: every credential is a reference to a
# Secret you create out of band (sealed-secrets, SOPS, external-secrets…).

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/zegit-zoo/meerkat
  # Defaults to .Chart.AppVersion, which is the release version in the
  # published chart and the placeholder 0.0.0-dev in a checkout. Image tags
  # have NO leading "v" (git tag v0.19.0 -> image tag 0.19.0); a leading "v"
  # is stripped.
  tag: ""
  # Pin by digest ("sha256:…"). When set the reference becomes
  # repository:tag@digest: the tag stays for readability and the digest
  # decides what runs.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

server:
  # false: no meerkat server from this release, only the operator
  # (operator.enabled must be true). Every server-only object is skipped:
  # the Deployment, Service, ServiceAccount, ConfigMap and the optional
  # Ingress, HTTPRoute, ServiceMonitor, PodDisruptionBudget, HPA and
  # NetworkPolicy. image.* still sets the operator's default server image.
  enabled: true
  # mcp  -> `mcp serve-http`: hosted MCP (Streamable HTTP) with OIDC auth,
  #         /livez, /readyz and /metrics. Port 4005 unless server.port.
  # http -> `http serve`: HTTP/OpenAPI server with a static bearer key
  #         (server.apiKey), /healthz only, no /metrics. Port 4004.
  mode: mcp
  # Container and Service port; null uses the mode's default.
  port: null
  # mcp mode: path the MCP endpoint is mounted at (--path).
  path: /mcp
  # mcp mode: --stateful keeps session state in-process; needs sticky
  # routing with more than one replica.
  stateful: false
  # mcp mode: --insecure-no-auth. With no auth: block in contentSource
  # the server REFUSES to bind 0.0.0.0 unless this is true. Set it only
  # when a gateway in front authenticates every request.
  insecureNoAuth: false
  # Serve /.well-known/security.txt (--security-txt).
  securityTxt: true
  # http mode only: the bearer key, from an existing Secret.
  apiKey:
    existingSecret: ""
    key: api-key
    # false: MEERKAT_API_KEY env from the Secret.
    # true:  mount the Secret and pass --api-key-file.
    mountAsFile: false
  # Appended after the generated arguments.
  extraArgs: []

# content-source.yaml, rendered into a ConfigMap and mounted read-only at
# /home/nonroot/.config/content-source.yaml with MEERKAT_CONTENT_SOURCE
# pointing at it. No config, raw or existingConfigMap: no file, and the
# image serves its embedded content (empty in every published release).
contentSource:
  # The file as an object, rendered with toYaml. An auth: block here is
  # what lets mcp mode start without insecureNoAuth (README.md,
  # "Authentication").
  config: {}
  # The same file as a YAML string, written verbatim (keeps comments).
  # Set config or raw, not both.
  raw: ""
  # Use an existing ConfigMap instead of rendering one.
  existingConfigMap: ""
  # Key in the (existing or rendered) ConfigMap holding the file.
  key: content-source.yaml

# Writable cache for type: url/gcs/s3 content (XDG_CACHE_HOME). The root
# filesystem is read-only; this is the only writable path.
cache:
  # Use an existing PersistentVolumeClaim instead of an emptyDir.
  existingClaim: ""
  # emptyDir settings.
  sizeLimit: 1Gi
  medium: ""

# Credentials, as references only. All are optional.
secrets:
  # envFrom one Secret holding the AWS default-chain variables for
  # type: s3 sources and S3 memory/intake/traversal stores
  # (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, optionally AWS_REGION).
  s3:
    existingSecret: ""
  # The traversal-log HMAC key. envName must equal
  # observability.traversal_log.hmac_key_env in contentSource.
  traversalLogKey:
    existingSecret: ""
    key: hmac-key
    envName: MEERKAT_TRAVERSAL_KEY
  # Any other variable from a Secret key, e.g. OTEL_EXPORTER_OTLP_HEADERS
  # or a token an OIDC-adjacent integration names:
  #   - name: OTEL_EXPORTER_OTLP_HEADERS
  #     secretName: otel-collector-auth
  #     key: headers
  #     optional: false
  env: []

# Plain extra environment (EnvVar objects), e.g. OTEL_* or GOMEMLIMIT.
extraEnv: []
# Extra envFrom sources (EnvFromSource objects).
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  # e.g. eks.amazonaws.com/role-arn or iam.gke.io/gcp-service-account.
  annotations: {}

# meerkat never talks to the Kubernetes API.
automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# No CPU limit by default: throttling a search server hurts latency more
# than it protects neighbours. Memory is limited.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Probe timings. The paths follow server.mode (mcp: /livez and /readyz;
# http: /healthz for both). The listener opens only after content is
# resolved and indexed, so the startup probe allows up to 10 minutes.
probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 120
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  # null: same as the container port.
  port: null
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: meerkat.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute (gateway.networking.k8s.io/v1).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: shared-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  # Defaults to one rule matching PathPrefix / to the Service.
  rules: []

# Prometheus Operator ServiceMonitor scraping /metrics (mcp mode only).
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

podDisruptionBudget:
  # null: create one when replicaCount > 1 or autoscaling is enabled.
  enabled: null
  minAvailable: 1
  maxUnavailable: null

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

networkPolicy:
  enabled: false
  # Peers allowed to reach the server port (NetworkPolicyPeer objects).
  # Empty: any source may connect to that port, and to nothing else.
  ingressFrom: []
  egress:
    # When true, egress is restricted to DNS plus the rules below.
    enabled: false
    rules: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# meerkat-operator (meerkat-mob#10, phase 2): the KnowledgeBase and
# MeerkatMob CRDs, their validating webhook and the KnowledgeBase
# reconciler, from ghcr.io/zegit-zoo/meerkat-operator. Off by default; it
# installs cluster-scoped objects (CRDs, a ClusterRole and binding, a
# ValidatingWebhookConfiguration). Install it once per cluster. README.md,
# "Operator", has the details.
operator:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/zegit-zoo/meerkat-operator
    # Defaults to .Chart.AppVersion, like image.tag; a leading "v" is
    # stripped.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The meerkat server image a MeerkatMob runs when its spec.image is
  # empty. Empty: this chart's own image (image.repository, image.tag,
  # image.digest above).
  serverImage: ""
  # Repositories a MeerkatMob's spec.image may name instead. An entry
  # matches one repository exactly, or, ending in "/", every repository
  # below it. The webhook and the reconciler both refuse anything else,
  # since whoever writes spec.image picks the image the mob's pods run.
  # Empty: no MeerkatMob may override the image.
  allowedImages:
    - ghcr.io/zegit-zoo/meerkat
  # Namespaces whose KnowledgeBases and MeerkatMobs the operator reconciles
  # and admits. The chart grants its permissions there alone (a RoleBinding
  # each) and scopes the webhook to them. Empty: the release namespace.
  # ["*"]: every namespace, with a ClusterRoleBinding.
  watchNamespaces: []
  crds:
    # Install or upgrade the CRDs with the chart. Set false when another
    # release or a GitOps tool owns them.
    install: true
    # Annotate them helm.sh/resource-policy: keep, so uninstalling the
    # chart does not delete the CRDs and every KnowledgeBase with them.
    keep: true
  serviceAccount:
    # Defaults to <fullname>-operator.
    name: ""
    annotations: {}
  webhook:
    # Serve the validating webhook. Off: no admission checks; the
    # reconciler still reports each tree in status.
    enabled: true
    port: 9443
    # The serving certificate. cert-manager (default) issues and renews it
    # and injects the CA into the webhook configuration; it must be
    # installed in the cluster.
    certManager:
      enabled: true
      # An Issuer or ClusterIssuer ({name, kind, group}). Empty: the chart
      # creates a self-signed Issuer for this certificate alone.
      issuerRef: {}
      duration: 2160h
      renewBefore: 360h
    # Without cert-manager (certManager.enabled=false) Helm generates a CA
    # and a serving certificate on install and reuses them on upgrade.
    # Nothing renews them: rotate by deleting the Secret and upgrading.
    selfSigned:
      validityDays: 365
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Appended after the generated arguments.
  extraArgs: []
  # A NetworkPolicy for the operator pod. Off by default. Ingress: the
  # webhook port from any source (the API server's source address differs
  # per cluster). Egress: DNS and the API server only. README.md,
  # "Operator NetworkPolicy", has the limits.
  networkPolicy:
    enabled: false
    # Where the operator reaches the API server. Required when enabled:
    # set cidrs, peers, or both. Most network plugins apply the policy
    # after the kubernetes Service's DNAT, so list the API server's
    # endpoint addresses (kubectl get endpointslices -n default -l
    # kubernetes.io/service-name=kubernetes), not only the Service IP.
    apiServer:
      # CIDRs, e.g. ["10.0.0.10/32", "10.0.0.11/32"].
      cidrs: []
      # NetworkPolicyPeer objects, for an API server that runs as pods
      # selected by labels.
      peers: []
      # TCP ports on those destinations. Empty: every port.
      ports: [443, 6443]
    # More NetworkPolicyIngressRule objects, e.g. a metrics port opened
    # with extraArgs --metrics-bind-address.
    extraIngress: []
    # More NetworkPolicyEgressRule objects.
    extraEgress: []
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
